name: Crawl M3U8 Stream 6h

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper

      - name: Run Crawler Script
        run: python main.py

      - name: Commit and Push results (if links.json exists)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f links.json ]; then
            git add links.json
            git commit -m "Auto-update stream links [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "File links.json không tồn tại, bỏ qua bước commit."
          fi
