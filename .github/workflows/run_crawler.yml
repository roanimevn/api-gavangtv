name: Crawl M3U8 Stream 6h

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Chạy tự động mỗi 6 tiếng

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    # Cấp quyền cho GitHub Actions có thể ghi và đẩy file mới lên repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Crawler Script
        run: python main.py

      - name: Commit and Push results (if any changes)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add links.json
          git commit -m "Auto-update stream links [skip ci]" || echo "No changes to commit"
          git push
