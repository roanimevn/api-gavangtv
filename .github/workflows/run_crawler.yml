name: Crawl M3U8 Stream

on:
  # Cho phép bấm nút chạy thủ công trên giao diện GitHub (Tab Actions)
  workflow_dispatch:
  
  # Tự động chạy định kỳ mỗi 6 tiếng một lần
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-crawler-job:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Tải mã nguồn của repo xuống môi trường chạy ảo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt Python phiên bản mới
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Cài đặt các thư viện cần thiết
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests fastapi uvicorn

      # 4. Chạy script của bạn
      - name: Run Python script
        run: python main.py
